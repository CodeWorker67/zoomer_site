<body>
  <div id="root"></div>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get('start');
        if (!raw || raw.indexOf('partner_') !== 0) return;
        var id = raw.slice(8);
        if (!/^[1-9]\d{0,19}$/.test(id)) return;
        if (!localStorage.getItem('zoomer_partner')) {
          localStorage.setItem('zoomer_partner', id);
        }
      } catch (e) {}
    })();
  </script>
